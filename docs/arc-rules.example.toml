# Example rules file for `cargo arc check`, explained in docs/RULES.md.
#
# Copy it next to your workspace `Cargo.toml` as `arc-rules.toml` and replace
# the crate names with your own. The workspace it describes has four crates:
# `cli` and `storage` on the outside, `services` in the middle, `core` at the
# bottom.

[config]
version = 1

# The list runs from the top layer to the bottom one, so a dependency may only
# point at a later entry. `cli` and `storage` share a position, which leaves
# dependencies between them unconstrained. `exhaustive` claims that these
# positions sort every crate of the workspace, so one they miss is reported
# instead of skipped in silence.
[[rules]]
type = "layers"
name = "architecture layers"
layers = [["cli", "storage"], "services", "core"]
direction = "top-down"
exhaustive = true

# `storage` sits above `services`, so the layer rule lets it reach down there.
# It still must not: the database adapter takes its types from `core` and is
# driven by `services`, never the other way round.
[[rules]]
type = "forbidden-dependency"
name = "no services in storage"
from = "storage"
to = "services"

# Without a `no-cycles` rule of its own a run checks the whole workspace for
# circular dependencies. Writing one replaces that, so this keeps the scope.
[[rules]]
type = "no-cycles"
name = "no cycles"
scope = "**"

# A diagnostic reports a gap in this file rather than in the architecture. All
# four stand at their default level here, so the section changes nothing until
# you edit it. `unlayered-node` also takes an `except` list, and a crate that
# is outside the architecture on purpose goes in it: build tooling, examples,
# benchmarks. The `except` of a rule does not reach here.
[diagnostics]
unlayered-node = { level = "deny", except = [] }
unmatched-baseline-entry = "warn"
unmatched-except = "warn"
unmatched-pattern = "deny"
