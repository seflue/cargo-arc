allow-branch = ["main"]
tag-name = "v{{version}}"
pre-release-commit-message = "Release {{version}}"
pre-release-hook = ["./scripts/pre-release-check.sh"]

# CHANGELOG.md carries <!-- next-header --> and <!-- next-url --> as anchors.
# Every replacement is exactly=1, so a drifted changelog aborts the release
# instead of silently rewriting the wrong line.
pre-release-replacements = [
  { file = "CHANGELOG.md", search = "## \\[Unreleased\\]", replace = "## [{{version}}] - {{date}}", exactly = 1 },
  { file = "CHANGELOG.md", search = "\\[Unreleased\\]: ", replace = "[{{version}}]: ", exactly = 1 },
  { file = "CHANGELOG.md", search = "\\.\\.\\.HEAD", replace = "...v{{version}}", exactly = 1 },
  { file = "CHANGELOG.md", search = "<!-- next-header -->", replace = "<!-- next-header -->\n\n## [Unreleased]", exactly = 1 },
  { file = "CHANGELOG.md", search = "<!-- next-url -->", replace = "<!-- next-url -->\n[Unreleased]: {{repository}}/compare/v{{version}}...HEAD", exactly = 1 },
]
