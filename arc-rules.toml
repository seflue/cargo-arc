# Architecture rules for cargo-arc itself, checked by `just lint`.
#
# cargo-arc is a single crate, so every pattern here is a module path, and each
# one covers its module and every module below it.

[config]
version = 1

# `cli` drives a run, `render` and `rules` are the two things a run produces,
# and they rest on the analysis layer. `diagnose`, `layout` and `analyze` share
# a position: the layout builder reads the cycle and order analysis, and that is
# how the diagram gets its shape. `hotspots` shares that position too: it builds
# the hotspot tree and its packed circles that `render::hotspots` draws, the
# same relationship `layout` has to the arc diagram; its own imports are
# `crate::graph` and `crate::volatility`, both below it. `js_registry` gets its
# own layer just above that: it holds `MODULES` and `bundle`, the transitive
# `@deps` closure `render::static_data::render_script` and
# `render::hotspots::render_script` each embed for their own entry module. It
# has no dependency of its own inside the crate, and is not graph analysis, so
# folding it into the analysis layer would misstate what it does. `ui` serves
# the page and reads the jump table out of `layout`; `cli` starts it.
[[rules]]
type = "layers"
name = "architecture layers"
layers = [
  ["cargo-arc::cli"],
  ["cargo-arc::ui"],
  ["cargo-arc::render", "cargo-arc::rules"],
  ["cargo-arc::js_registry"],
  ["cargo-arc::diagnose", "cargo-arc::layout", "cargo-arc::analyze", "cargo-arc::hotspots"],
  ["cargo-arc::graph"],
  ["cargo-arc::model", "cargo-arc::volatility"],
]
direction = "top-down"
# The claim is over the modules of this crate: a new top-level module fails the
# run until it is placed. The crate node `cargo-arc` is not claimed, because no
# crate pattern names it.
exhaustive = true

# No `no-cycles` rule: without one the run checks the whole crate, which is the
# scope we want. Writing it out would replace that rule with an identical one.
